<!DOCTYPE html>
<html lang="en-GB">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta charset="utf-8" />
	<meta name="description" content="A very basic, browser-based, privacy-conscious, CSV editor">
	<link rel="manifest" href="manifest.json" />
	<title>CSV Editor | Open Innovations</title>
	<link rel="icon" href="resources/oi-square-5.svg" />
	<link rel="StyleSheet" href="resources/style-editor.css" type="text/css" />
	<script src="dist/oi.csv.js"></script>
	<style>	
	.container {
		display: flex;
		height: 100vh;
		max-height: 100vh;
		flex-direction: column;
	}
	#main { flex-grow: 1; }
	#main textarea { display: block; width: 100%; height: 200px; }
	header { padding: 0.5rem 1rem; }
	header { display: flex; align-items: center; gap: 0.5rem; }
	header h1 { display: flex; align-items: center; gap: 0.5rem; line-height: calc(2rem + 4px); }
	header h1 + * { margin-top: 0; flex-grow: 1; text-align: right; }
	header button { border-radius: 2px; }
	header a:last-child { line-height: unset; }
	.main-panel { width: 100%; height: 100%; position: relative; }
	.loader { display: flex; height: 100%; width: 100%; align-items: center; justify-content: center; position: absolute; top: 0; left: 0; text-align:center; }
	#standard_files { position: absolute; top: 0; left: 0; z-index: 1; width: 100%; height: 100%; opacity: 0.01; }
	#output { width: 100%; height: 100%; display: flex; position: absolute; left: 0; top: 0; }
	.oi-viz-table-holder { max-height: unset; height: 100%; }
	.hovering { border: 4px dashed grey; }
	.active .loader, .hidden { display: none; }
	header a.more-info { display: inline-block; background: white; color: black; border-radius: 100%; width: 1.5em; height: 1.5em; line-height: 1.5em; text-align: center; font-style: italic; }
	#progress { width: 100%; display: flex; }
	#progress.active { height: 4px; }
	.progress-inner { width: 0; height: 100%; background: #1dd3a7; }
	</style>
</head>
<body class="b1-bg">

	<div class="container">

		<header class="b1-bg">
			<h1><a href="https://open-innovations.org/" aria-label="Open Innovations"><svg width="1.5rem" height="1.5rem" overflow="auto" viewBox="-32 -32 64 64" xmlns="http://www.w3.org/2000/svg"><mask id="oi-person"><path d="m-32-32h64v64h-12v-24a4 4 0 0 0 -4 -4h-8a4 4 0 0 0 -4 4v24h-36zm44 27m-8 0a8 8 0 1 0 16 0 8 8 0 1 0-16 0" fill="#fff"></path></mask><g id="oi-logo" fill="#1DD3A7"><circle r="32" mask="url(#oi-person)"></circle></g></svg></a> <span>CSV Editor</span></h1>
			<div><a href="editor-about.html" class="more-info">i</a></div>
		</header>
		<div id="progress"><div class="progress-inner"></div></div>
		<div id="main" class="b6-bg" style="min-height: 400px;">
			<div class="hidden">
				<textarea id="input"></textarea>
				<button id="activate" data-oi-csv data-oi-csv-src="input" data-oi-csv-target="output" class="c5-bg">Edit as table</button>
			</div>
			<div class="main-panel">
				<div class="loader">
					<p>Drop a CSV file here<br />(or click to browse files)</p>
					<input id="standard_files" class="fileselect" type="file" title="browse" name="files[]" multiple="multiple" accept=".csv">
				</div>
				<div id="output"></div>
			</div>
		</div>
	</div>

<script>
var OI = OI || {};
if(!OI.ready){
	OI.ready = function(fn){
		// Version 1.1
		if(document.readyState != 'loading') fn();
		else document.addEventListener('DOMContentLoaded', fn);
	};
}
function getEl(id){ return document.getElementById(id); }
OI.ready(function(){
	var activated = false;
	const target = getEl("main");
	const inputEl = getEl("input");
	const output = getEl("output");
	
	function activate(){
		if(!activated){
			getEl('activate').click();
			if(!document.querySelector('div.clear')){
				// Make clear button
				var clear = document.createElement('div'),btn = document.createElement('button');
				clear.classList.add('clear');
				btn.classList.add('c5-bg');
				btn.innerHTML = 'New';
				btn.addEventListener('click',reset);
				clear.appendChild(btn);
				document.querySelector('header > *:last-child').before(clear);
			}
		}

		target.classList.remove('hovering');
		target.classList.add('active');
		activated = true;
	}
	function reset(){
		OI.CSVs.list[0].editor.clear();
		target.classList.remove('active');
		activated = false;
		document.querySelector('div.clear').remove();
		inputEl.value = '';
	}
	target.addEventListener("dragover", (event) => { event.preventDefault(); });
	target.addEventListener("dragover", (event) => { target.classList.add('hovering'); });
	target.addEventListener("dragleave", (event) => { target.classList.remove('hovering'); });
	target.addEventListener("drop", (event) => {
		// prevent default action (open as a link for some elements)
		event.stopPropagation();
		event.preventDefault();
		handleFileSelect(event);
	});

	if(inputEl.value) activate();

	function ChunkedFileReader(input,opts){
		if(!opts) opts = {};
		if(!input){
			console.error('No <input> provided');
			return this;
		}
		var chunk = (typeof opts.chunk==="number" ? opts.chunk : 65536);
		var delay = (typeof opts.delay==="number" ? opts.delay : 20);
		this.read = function(input){
			var myFile,size,i,blob,reader;
			i = 0;
			if(input.files && input.files[0]){
				myFile = input.files[0];
				size = myFile.size;
				if(typeof opts.init==="function") opts.init.call(opts.this||_obj,{'size':size,'file':input.files[0]});
				function readChunk(i){
					blob = myFile.slice(i, i + chunk);
					reader = new FileReader();
					reader.addEventListener('load',function(e){
						if(typeof opts.readChunk==="function") opts.readChunk.call(opts.this||_obj,e.target.result,i,i+chunk,size);
						if(typeof opts.progress==="function") opts.progress.call(opts.this||_obj,e.target.result,i,i+chunk,size);
						i += chunk;
						if(i < size) setTimeout(readChunk,delay,i);
						else{
							if(typeof opts.complete==="function") opts.complete.call(opts.this||_obj,{'size':size,'file':input.files[0]});
						}
					});
					reader.readAsBinaryString(blob);
				}
				// Start reading
				readChunk(i);
			}
			return this;
		};

		var _obj = this;
		input.addEventListener("change",function(){ _obj.read(this); });

		return this;
	}
	var p = document.getElementById('progress');
	var pi = p.querySelector('.progress-inner');
	ChunkedFileReader(getEl('standard_files'),{
		'chunk': 100000,
		'init': function(arg){
			this.txt = '';
			p.classList.add('active');
			pi.style.width = 0;
		},
		'progress': function(chunk,start,end,len){
			this.txt += chunk;
			var pc = Math.min(100,(100*end/len)).toFixed(1)+'%';
			pi.style.width = pc;
		},
		'complete': function(arg){
			p.classList.remove('active');
			input.value = this.txt;
			activate();
			input.dispatchEvent(new Event('change'));
		}
	});
});
</script>
