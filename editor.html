<!DOCTYPE html>
<html>
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta charset="utf-8" />
	<title>CSV Editor example | Open Innovations</title>
	<link rel="icon" href="resources/oi-square-black.svg" />
	<link rel="StyleSheet" href="resources/style.css" type="text/css" />
	<style>
	.container {
		display: flex;
		height: 100vh;
		max-height: 100vh;
		flex-direction: column;
	}
	#main { flex-grow: 1; }
	#main textarea { display: block; width: 100%; height: 200px; }
	header { padding: 0.5rem 1rem; display: flex; align-items: center; }
	header h1 { display: flex; align-items: center; gap: 0.5rem; line-height: calc(2rem + 4px); }
	header h1 + * { margin-top: 0; flex-grow: 1; text-align: right; }
	header button { border-radius: 2px; }
	header a:last-child { line-height: unset; }
	footer p:last-child { margin-bottom: 0; }
	.main-panel { width: 100%; height: 100%; position: relative; }
	.loader { display: flex; height: 100%; width: 100%; align-items: center; justify-content: center; position: absolute; top: 0; left: 0; }
	.loader #standard_files { position: absolute; top: 0; left: 0; z-index: 1; width: 100%; height: 100%; opacity: 0.01; }
	#output { width: 100%; height: 100%; display: flex; position: absolute; left: 0; top: 0; }
	.hidden { display: none; }
	.oi-viz-table-holder { max-height: unset; height: 100%; }
	.hovering { border: 4px dashed grey; }
	.active .loader { display: none; }
	</style>
	<script src="dist/oi.csv.js"></script>
</head>
<body class="b1-bg">

	<div class="container">

		<header class="b1-bg">
			<h1><a href="https://open-innovations.org/"><svg width="1.5rem" height="1.5rem" overflow="auto" viewBox="-32 -32 64 64" xmlns="http://www.w3.org/2000/svg"><mask id="oi-person"><path d="m-32-32h64v64h-12v-24a4 4 0 0 0 -4 -4h-8a4 4 0 0 0 -4 4v24h-36zm44 27m-8 0a8 8 0 1 0 16 0 8 8 0 1 0-16 0" fill="#fff"></path></mask><g id="oi-logo" fill="#1DD3A7"><circle r="32" mask="url(#oi-person)"></circle></g></svg></a> <a href="/oi.csv.js/">CSV Editor</a></h1>
		</header>

		<div id="main" class="b6-bg" style="min-height: 400px;">
			<div class="hidden">
				<textarea id="input"></textarea>
				<button id="activate" data-oi-csv data-oi-csv-src="input" data-oi-csv-target="output" class="c9-bg">Edit as table</button>
			</div>
			<div class="main-panel">
				<div class="loader">
					<p>Drop a CSV file here (or click to browse files)</p>
					<input id="standard_files" class="fileselect" type="file" title="browse" name="files[]" multiple="multiple" accept=".csv">
				</div>
				<div id="output"></div>
			</div>
		</div>

		<footer class="b1-bg padded">
			<p>&copy; 2024-2025 Stuart Lowe, <a href="https://open-innovations.org/">Open Innovations</a> (<a href="https://github.com/open-innovations/oi.csv.js/">MIT licence</a>).</p>
		</footer>
	</div>

	<script>
	var OI = OI || {};
	if(!OI.ready){
		OI.ready = function(fn){
			// Version 1.1
			if(document.readyState != 'loading') fn();
			else document.addEventListener('DOMContentLoaded', fn);
		};
	}
	OI.ready(function(){
		var activated = false;
		const target = document.getElementById("main");
		const input = document.getElementById('input');
		const output = document.getElementById('output');
		
		function activate(){
			if(!activated){
				document.getElementById('activate').click();
				// Make clear button
				var clear = document.createElement('div');
				clear.classList.add('clear');
				var btn = document.createElement('button');
				btn.classList.add('c5-bg');
				btn.innerHTML = 'Clear';
				btn.addEventListener('click',reset);
				clear.appendChild(btn);
				document.querySelector('header').appendChild(clear);
			}

			target.classList.remove('hovering');
			target.classList.add('active');
			activated = true;
		}
		function reset(){
			OI.CSVs.list[0].editor.clear();
			target.classList.remove('active');
			activated = false;
			document.querySelector('div.clear').remove();
		}

		target.addEventListener("dragover", (event) => {
			// prevent default to allow drop
			event.preventDefault();
		});
		target.addEventListener("dragover", (event) => {
			target.classList.add('hovering');
		});
		target.addEventListener("dragleave", (event) => {
			target.classList.remove('hovering');
		});
		target.addEventListener("drop", (event) => {
			// prevent default action (open as a link for some elements)
			event.stopPropagation();
			event.preventDefault();
			handleFileSelect(event);
		});
		
		document.getElementById('standard_files').addEventListener('change',function(evt){
			evt.stopPropagation();
			evt.preventDefault();
			return handleFileSelect(evt);
		}, false);

		if(input.value) activate();


		function handleFileSelect(event){
			var files;
			if(event.dataTransfer && event.dataTransfer.files) files = event.dataTransfer.files; // FileList object.
			if(!files && event.target && event.target.files) files = event.target.files;
			var reader = new FileReader();
			reader.readAsText(files[0], "UTF-8");
			reader.addEventListener('load',function(e){
				input.value = e.target.result;
				activate();
				input.dispatchEvent(new Event('change'));
			});
			reader.onerror = function(e){ console.error('Failed to read file'); };
			return;
		}

	});
	</script>

	<script src="https://open-innovations.org/resources/oi.log.js"></script>
	<script>
	OI.log.setup({'id':'odileeds','target':['open-innovations.github.io']}).add('action=view');
	</script>
</body>
</html>
